name: Build Bio Crisis (Android APK)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Godot 4.3 & Export Templates
        run: |
          set -e
          mkdir -p /tmp/godot_dl ~/.local/share/godot/export_templates/4.3.stable
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot_dl/godot.zip
          unzip -qo /tmp/godot_dl/godot.zip -d /tmp/godot_dl
          chmod +x /tmp/godot_dl/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/godot_dl/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot_dl/templates.tpz
          unzip -qo /tmp/godot_dl/templates.tpz -d /tmp/godot_dl/tpl
          mv /tmp/godot_dl/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Create debug keystore & Export Android APK
        run: |
          set -e
          mkdir -p build/android ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          godot --headless --import --quit || true
          godot --headless --verbose --export-debug "Android" build/android/bio-crisis-debug.apk
          ls -lh build/android

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioCrisis-Android-APK
          path: build/android/bio-crisis-debug.apk
