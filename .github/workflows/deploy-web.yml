name: Build & Deploy Bio Crisis (Web)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 & Official Export Templates
        run: |
          set -e
          mkdir -p /tmp/godot_dl ~/.local/share/godot/export_templates/4.3.stable
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot_dl/godot.zip
          unzip -qo /tmp/godot_dl/godot.zip -d /tmp/godot_dl
          chmod +x /tmp/godot_dl/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/godot_dl/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot_dl/templates.tpz
          unzip -qo /tmp/godot_dl/templates.tpz -d /tmp/godot_dl/tpl
          mv /tmp/godot_dl/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Import resources & Export Web build
        run: |
          mkdir -p build/web
          godot --headless --import --quit || true
          godot --headless --verbose --export-release "Web" build/web/index.html
          ls -lh build/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/web"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
